services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - beauty_data:/app/data
      - ${HOST_ROOT:-/Users/chen/Development/debug/batch-beatuy-editor}/input:/input
      - ${HOST_ROOT:-/Users/chen/Development/debug/batch-beatuy-editor}/output:/output
      - ${HOST_ROOT:-/Users/chen/Development/debug/batch-beatuy-editor}/workspace:/workspace
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  beauty_data:
